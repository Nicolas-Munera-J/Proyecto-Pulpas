{% extends "base.html" %}
{% block titulo %}Nuevo producto{% endblock %}
{% block contenido %}
<div class="tarjeta-centrada">
    <h1>Nuevo producto</h1>
    <form method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="presentacion">Presentación</label>
        <input type="text" id="presentacion" name="presentacion" placeholder="Ej. Bolsa 500g" required>

        <label for="unidad_medida">Unidad de medida</label>
        <input type="text" id="unidad_medida" name="unidad_medida" placeholder="Ej. unidad, kg" required>

        <label for="precio">Precio</label>
        <input type="number" id="precio" name="precio" step="0.01" min="0" value="0" required>

        <label for="umbral_minimo">Umbral mínimo (para alerta de stock bajo)</label>
        <input type="number" id="umbral_minimo" name="umbral_minimo" min="0" value="0" required>

        <button type="submit" class="boton-primario">Guardar producto</button>
    </form>
</div>
{% endblock %}
