{% extends "base.html" %}
{% block titulo %}Nuevo usuario{% endblock %}
{% block contenido %}
<div class="tarjeta-centrada">
    <h1>Nuevo usuario</h1>
    <form method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="120" required value="{{ valores.nombre }}">

        <label for="email">Correo</label>
        <input type="email" id="email" name="email" maxlength="120" required value="{{ valores.email }}">

        <label for="rol">Rol</label>
        <select id="rol" name="rol" required>
            <option value="" disabled {% if not valores.rol %}selected{% endif %}>Selecciona un rol</option>
            {% for clave, etiqueta in roles.items() %}
            <option value="{{ clave }}" {% if clave == valores.rol %}selected{% endif %}>{{ etiqueta }}</option>
            {% endfor %}
        </select>

        <label for="password">Contraseña inicial (mínimo {{ minimo_password }} caracteres)</label>
        <input type="password" id="password" name="password" minlength="{{ minimo_password }}" required autocomplete="new-password">

        <button type="submit" class="boton-primario">Crear usuario</button>
        <a href="{{ url_for('usuarios.listar') }}" class="enlace-cancelar">Volver</a>
    </form>
</div>
{% endblock %}
