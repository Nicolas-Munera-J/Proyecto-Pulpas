{% extends "base.html" %}
{% block titulo %}Registrar entrada{% endblock %}
{% block contenido %}
<div class="tarjeta-centrada">
    <h1>Registrar entrada de inventario</h1>
    <form id="formEntrada" method="POST">
        <label for="producto_id">Producto</label>
        <select id="producto_id" name="producto_id" required>
            <option value="" disabled selected>Selecciona un producto</option>
            {% for p in productos %}
            <option value="{{ p.id }}">{{ p.nombre }} ({{ p.presentacion }}) — disponible: {{ p.existencia_disponible }}</option>
            {% endfor %}
        </select>

        <label for="cantidad">Cantidad a ingresar</label>
        <input type="number" id="cantidad" name="cantidad" min="1" required>

        <label for="observacion">Observación (opcional)</label>
        <input type="text" id="observacion" name="observacion" placeholder="Ej. Compra proveedor La Cosecha">

        <button type="submit" class="boton-primario">Registrar entrada</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById("formEntrada").addEventListener("submit", function (evento) {
        evento.preventDefault();
        const formulario = evento.target;
        const producto = formulario.producto_id.options[formulario.producto_id.selectedIndex].text;
        const cantidad = formulario.cantidad.value;

        Swal.fire({
            icon: "question",
            title: "¿Confirmar entrada de inventario?",
            html: `Vas a ingresar <b>${cantidad}</b> unidades de <b>${producto}</b>.`,
            showCancelButton: true,
            confirmButtonText: "Sí, registrar",
            cancelButtonText: "Cancelar",
            confirmButtonColor: "#e8590c"
        }).then((resultado) => {
            if (resultado.isConfirmed) {
                formulario.submit();
            }
        });
    });
</script>
{% endblock %}
